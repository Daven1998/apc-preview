<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006633"/>
      <stop offset="100%" stop-color="#0E8FBF"/>
    </linearGradient>
    <linearGradient id="lime" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D90708"/>
      <stop offset="100%" stop-color="#7FD662"/>
    </linearGradient>
  </defs>
  <!-- background full bleed for maskable safety -->
  <rect width="512" height="512" rx="0" ry="0" fill="url(#bg)"/>
  <!-- lime accent triangle bottom-left -->
  <polygon points="0,512 0,310 220,512" fill="url(#lime)" opacity="0.95"/>
  <!-- APC wordmark -->
  <g font-family="DM Sans, Inter, -apple-system, Helvetica, sans-serif" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    <text x="256" y="290" font-size="160" letter-spacing="2">APC</text>
  </g>
</svg>
